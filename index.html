<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Morning Page 🍋</title>


  <style>

    /* =========================================
       기본 설정
    ========================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }


    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #FFFBEA;

      color: #3E3A2F;
    }


    a {
      text-decoration: none;
      color: inherit;
    }


    button,
    textarea {
      font-family: inherit;
    }



    /* =========================================
       전체 콘텐츠 가운데 정렬
    ========================================= */

    .container {

      width: min(
        1000px,
        calc(100% - 48px)
      );

      margin-left: auto;
      margin-right: auto;

    }



    /* =========================================
       헤더
    ========================================= */

    header {

      width: 100%;

      height: 80px;

      display: flex;

      align-items: center;

      background: #FFFBEA;

      border-bottom:
        1px solid #F2E8B8;

    }


    .header-inner {

      width: min(
        1000px,
        calc(100% - 48px)
      );

      margin-left: auto;
      margin-right: auto;

      display: flex;

      justify-content: space-between;

      align-items: center;

    }


    /* 로고 */

    .logo {

      font-size: 22px;

      font-weight: 800;

      color: #5D552F;

      white-space: nowrap;

    }


    /* 메뉴 */

    nav {

      display: flex;

      align-items: center;

      gap: 6px;

    }


    nav a {

      padding:
        10px 14px;

      border-radius: 12px;

      font-size: 14px;

      color: #77705A;

      transition: 0.2s;

    }


    nav a:hover {

      background: #FFF3A8;

      color: #514A29;

    }



    /* =========================================
       메인
    ========================================= */

    main {

      width: 100%;

      padding:
        55px 0 80px;

    }



    /* =========================================
       인사말
    ========================================= */

    .welcome {

      margin-bottom: 30px;

    }


    .welcome .small {

      margin-bottom: 9px;

      font-size: 14px;

      color: #8C835F;

    }


    .welcome h1 {

      margin: 0;

      font-size: 34px;

      line-height: 1.4;

      letter-spacing: -1px;

      color: #393522;

    }


    .welcome h1 span {

      color: #D7A900;

    }



    /* =========================================
       메인 2단 레이아웃
    ========================================= */

    .layout {

      width: 100%;

      display: grid;

      grid-template-columns:
        minmax(0, 1.65fr)
        minmax(280px, 1fr);

      gap: 24px;

      align-items: start;

    }



    /* =========================================
       카드
    ========================================= */

    .card {

      width: 100%;

      background: #FFFFFF;

      border:
        1px solid #F0E7BE;

      border-radius: 24px;

      padding: 30px;

      box-shadow:
        0 8px 30px
        rgba(109, 91, 20, 0.05);

    }



    /* =========================================
       날짜
    ========================================= */

    .date {

      margin-bottom: 28px;

      font-size: 15px;

      color: #8A825F;

    }



    /* =========================================
       섹션 제목
    ========================================= */

    .section-title {

      margin-bottom: 14px;

      font-size: 15px;

      font-weight: 700;

      color: #514B37;

    }



    /* =========================================
       날씨 선택
    ========================================= */

    .weather-list {

      display: flex;

      flex-wrap: wrap;

      gap: 9px;

      margin-bottom: 32px;

    }


    .weather {

      width: 72px;

      height: 72px;

      padding: 0;

      border:
        1px solid #EEE7CA;

      background: #FFFDF5;

      border-radius: 18px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      transition:
        transform 0.2s,
        background 0.2s,
        border 0.2s;

      color: #77705A;

      font-size: 11px;

    }


    .weather:hover {

      transform:
        translateY(-3px);

      background:
        #FFF6B8;

    }


    .weather.selected {

      background:
        #FFE45C;

      border-color:
        #E8C92C;

      transform:
        translateY(-3px);

      color:
        #514711;

      font-weight: 700;

    }


    .weather-icon {

      display: block;

      margin-bottom: 5px;

      font-size: 29px;

      line-height: 1;

    }



    /* =========================================
       기분 선택
    ========================================= */

    .mood-list {

      width: 100%;

      display: flex;

      justify-content:
        space-between;

      gap: 8px;

      margin-bottom: 32px;

    }


    .mood {

      flex:
        1 1 0;

      max-width: 58px;

      height: 54px;

      padding: 0;

      border:
        1px solid #EEE7CA;

      background:
        #FFFDF5;

      border-radius: 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 25px;

      cursor: pointer;

      transition:
        transform 0.2s,
        background 0.2s,
        border 0.2s;

    }


    .mood:hover {

      transform:
        translateY(-3px);

      background:
        #FFF6B8;

    }


    .mood.selected {

      background:
        #FFE45C;

      border-color:
        #E8C92C;

      transform:
        translateY(-3px);

    }



    /* =========================================
       글쓰기
    ========================================= */

    textarea {

      width: 100%;

      min-height: 280px;

      display: block;

      padding: 18px;

      border:
        1px solid #EEE7CA;

      border-radius: 18px;

      resize: vertical;

      outline: none;

      background:
        #FFFDF8;

      color:
        #4B4739;

      font-size: 15px;

      line-height: 1.8;

    }


    textarea::placeholder {

      color: #AAA48F;

    }


    textarea:focus {

      border-color:
        #E5C82F;

      box-shadow:
        0 0 0 3px
        rgba(255, 224, 75, 0.18);

    }



    /* =========================================
       저장 버튼
    ========================================= */

    .save-button {

      width: 100%;

      margin-top: 16px;

      padding: 16px;

      border: none;

      border-radius: 14px;

      background:
        #F5D62F;

      color:
        #514711;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.2s;

    }


    .save-button:hover {

      background:
        #EBCB1E;

      transform:
        translateY(-1px);

    }


    .save-button:disabled {

      opacity: 0.6;

      cursor: wait;

      transform: none;

    }



    /* =========================================
       오른쪽 카드
    ========================================= */

    .side-card {

      margin-bottom: 20px;

    }


    .side-card h2 {

      margin:
        0 0 20px;

      font-size: 18px;

      color: #403C2D;

    }



    /* =========================================
       최근 기록
    ========================================= */

    .record-item {

      padding:
        15px 0;

      border-bottom:
        1px solid #F0EBD8;

    }


    .record-item:last-child {

      border-bottom:
        none;

    }


    .record-date {

      margin-bottom: 7px;

      font-size: 12px;

      color: #9B9377;

    }


    .record-icons {

      display: flex;

      align-items: center;

      gap: 7px;

      font-size: 20px;

    }


    .record-preview {

      margin-top: 8px;

      font-size: 13px;

      line-height: 1.6;

      color: #77715F;

      word-break: break-word;

    }


    .more-button {

      display: block;

      margin-top: 16px;

      padding: 12px;

      border-radius: 12px;

      background:
        #FFF8D9;

      text-align: center;

      font-size: 13px;

      color: #71683D;

      transition:
        background 0.2s;

    }


    .more-button:hover {

      background:
        #FFF1A8;

    }



    /* =========================================
       Morning Tip
    ========================================= */

    .tip {

      padding: 22px;

      border-radius: 20px;

      background:
        #FFF2A8;

      font-size: 14px;

      line-height: 1.7;

      color: #655D39;

    }


    .tip strong {

      display: block;

      margin-bottom: 7px;

      color: #514A25;

    }


    .empty-message {

      font-size: 13px;

      color: #999;

      line-height: 1.6;

    }



    /* =========================================
       태블릿
    ========================================= */

    @media (max-width: 850px) {

      .layout {

        grid-template-columns: 1fr;

      }


      .side-card {

        margin-bottom: 18px;

      }

    }



    /* =========================================
       모바일
    ========================================= */

    @media (max-width: 600px) {


      .container {

        width:
          calc(100% - 32px);

      }


      .header-inner {

        width:
          calc(100% - 32px);

      }


      header {

        height: auto;

        padding:
          17px 0;

      }


      .logo {

        font-size: 18px;

      }


      nav {

        gap: 1px;

      }


      nav a {

        padding:
          7px 8px;

        font-size: 11px;

      }


      main {

        padding:
          32px 0 55px;

      }


      .welcome {

        margin-bottom: 24px;

      }


      .welcome .small {

        font-size: 12px;

      }


      .welcome h1 {

        font-size: 26px;

        letter-spacing:
          -0.7px;

      }


      .card {

        padding: 20px;

        border-radius: 20px;

      }


      .date {

        margin-bottom: 23px;

      }


      .weather-list {

        gap: 7px;

      }


      .weather {

        width: 61px;

        height: 64px;

        border-radius: 16px;

      }


      .weather-icon {

        font-size: 25px;

      }


      .mood-list {

        gap: 5px;

      }


      .mood {

        height: 47px;

        border-radius: 14px;

        font-size: 21px;

      }


      textarea {

        min-height: 240px;

        font-size: 14px;

      }

    }



    /* =========================================
       아주 작은 모바일
    ========================================= */

    @media (max-width: 390px) {


      .container {

        width:
          calc(100% - 24px);

      }


      .header-inner {

        width:
          calc(100% - 24px);

      }


      .logo {

        font-size: 16px;

      }


      nav a {

        padding:
          6px 5px;

        font-size: 10px;

      }


      .weather {

        width: 57px;

      }


      .mood {

        font-size: 19px;

      }

    }

  </style>

</head>



<body>


  <!-- ======================================
       헤더
  ======================================= -->

  <header>

    <div class="header-inner">


      <a
        href="index.html"
        class="logo"
      >
        🍋 Morning Page
      </a>


      <nav>

        <a href="index.html">
          오늘 쓰기
        </a>

        <a href="calendar.html">
          달력
        </a>

        <a href="records.html">
          기록
        </a>

      </nav>


    </div>

  </header>



  <!-- ======================================
       메인
  ======================================= -->

  <main>

    <div class="container">


      <!-- 인사말 -->

      <section class="welcome">

        <div
          class="small"
          id="todayEnglish"
        ></div>


        <h1>

          좋은 아침이에요.<br>

          <span>
            오늘의 나
          </span>
          를 기록해보세요.

        </h1>

      </section>



      <!-- ==================================
           2단 레이아웃
      =================================== -->

      <div class="layout">



        <!-- ==================================
             왼쪽 : 기록 작성
        =================================== -->

        <section class="card">


          <!-- 날짜 -->

          <div
            class="date"
            id="todayDate"
          ></div>



          <!-- ================================
               날씨
          ================================= -->

          <div class="section-title">

            오늘의 날씨는 어떤가요?

          </div>


          <div class="weather-list">


            <button
              type="button"
              class="weather selected"
              data-weather="☀️ 맑음"
            >

              <span
                class="weather-icon"
              >
                ☀️
              </span>

              <span>
                맑음
              </span>

            </button>



            <button
              type="button"
              class="weather"
              data-weather="🌤️ 구름 조금"
            >

              <span
                class="weather-icon"
              >
                🌤️
              </span>

              <span>
                구름 조금
              </span>

            </button>



            <button
              type="button"
              class="weather"
              data-weather="⛅ 흐림"
            >

              <span
                class="weather-icon"
              >
                ⛅
              </span>

              <span>
                흐림
              </span>

            </button>



            <button
              type="button"
              class="weather"
              data-weather="🌧️ 비"
            >

              <span
                class="weather-icon"
              >
                🌧️
              </span>

              <span>
                비
              </span>

            </button>



            <button
              type="button"
              class="weather"
              data-weather="⛈️ 소나기"
            >

              <span
                class="weather-icon"
              >
                ⛈️
              </span>

              <span>
                소나기
              </span>

            </button>



            <button
              type="button"
              class="weather"
              data-weather="❄️ 눈"
            >

              <span
                class="weather-icon"
              >
                ❄️
              </span>

              <span>
                눈
              </span>

            </button>



            <button
              type="button"
              class="weather"
              data-weather="🌨️ 눈/비"
            >

              <span
                class="weather-icon"
              >
                🌨️
              </span>

              <span>
                눈/비
              </span>

            </button>



            <button
              type="button"
              class="weather"
              data-weather="🌫️ 안개"
            >

              <span
                class="weather-icon"
              >
                🌫️
              </span>

              <span>
                안개
              </span>

            </button>


          </div>



          <!-- ================================
               기분
          ================================= -->

          <div class="section-title">

            오늘의 기분은 어떤가요?

          </div>


          <div class="mood-list">


            <button
              type="button"
              class="mood"
            >
              😭

            <button
              type="button"
              class="mood"
            >
              😣

            <button
              type="button"
              class="mood"
            >
              😢
            </button>


            <button
              type="button"
              class="mood"
            >
              😞
            </button>


            <button
              type="button"
              class="mood selected"
            >
              😐
            </button>


            <button
              type="button"
              class="mood"
            >
              🙂
            </button>


            <button
              type="button"
              class="mood"
            >
              😊
            </button>


            <button
              type="button"
              class="mood"
            >
              😄
            </button>


            <button
              type="button"
              class="mood"
            >
              🤩
            </button>


          </div>



          <!-- ================================
               내용
          ================================= -->

          <div class="section-title">

            오늘 아침에는 어떤 생각이 드나요?

          </div>


          <textarea
            id="content"
            placeholder="지금 떠오르는 생각을 자유롭게 적어보세요.

잘 써야 한다는 부담은 내려놓고,
그냥 생각나는 대로 적어도 괜찮아요."
          ></textarea>



          <!-- ================================
               저장 버튼
          ================================= -->

            type="button"
            class="save-button"

        <!-- ==================================
             오른쪽 : 최근 기록
        =================================== -->

        <aside>


          <section
            class="card side-card"
          >


            <h2>
              최근 기록
            </h2>


            <div
              id="recentRecords"
            >

              <div
                class="empty-message"
              >
                기록을 불러오는 중...
              </div>

            </div>


            <a
              href="records.html"
              class="more-button"
            >
              모든 기록 보기 →
            </a>


          </section>



          <!-- Morning Tip -->

          <div class="tip">

            <strong>
              🍋 Morning Tip
            </strong>

            완벽하게 쓰려고 하지 않아도 괜찮아요.
            오늘 머릿속에 떠오르는 생각을
            그대로 적어보세요.

          </div>


        </aside>


      </div>

    </div>

  </main>



  <!-- ======================================
       JavaScript
  ======================================= -->

  <script>


    /* ======================================
       Google Apps Script 주소
    ======================================= */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwUo8rG3-Oi4dmg5gmwmil1rgMByuXf3VPEBpy308MFuy01gDEZLHJ3x8Qfuev8pTQUvQ/exec";



    /* ======================================
       현재 선택된 날씨
    ======================================= */

    let selectedWeather =
      "☀️ 맑음";



    /* ======================================
       오늘 날짜 표시
    ======================================= */

    function setToday() {


      const now =
        new Date();


      const year =
        now.getFullYear();


      const month =
        now.getMonth() + 1;


      const day =
        now.getDate();


      const weekdays = [

        "일요일",
        "월요일",
        "화요일",
        "수요일",
        "목요일",
        "금요일",
        "토요일"

      ];


      document
        .getElementById("todayDate")
        .textContent =
        `${year}년 ${month}월 ${day}일 ${weekdays[now.getDay()]}`;


      document
        .getElementById("todayEnglish")
        .textContent =
        now.toLocaleDateString(
          "en-US",
          {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
          }
        );

    }



    /* ======================================
       날씨 선택
    ======================================= */

    document
      .querySelectorAll(".weather")
      .forEach(function(button) {


        button.addEventListener(
          "click",
          function() {


            /*
             * 기존 선택 해제
             */

            document
              .querySelectorAll(".weather")
              .forEach(function(item) {

                item.classList.remove(
                  "selected"
                );

              });


            /*
             * 현재 버튼 선택
             */

            button.classList.add(
              "selected"
            );


            /*
             * 선택한 날씨 저장
             */

            selectedWeather =
              button.dataset.weather;

          }
        );

      });



    /* ======================================
       기분 선택
    ======================================= */

    document
      .querySelectorAll(".mood")
      .forEach(function(button) {


        button.addEventListener(
          "click",
          function() {


            /*
             * 기존 선택 해제
             */

            document
              .querySelectorAll(".mood")
              .forEach(function(item) {

                item.classList.remove(
                  "selected"
                );

              });


            /*
             * 현재 기분 선택
             */

            button.classList.add(
              "selected"
            );

          }
        );

      });



    /* ======================================
       스프레드시트 기록 가져오기
    ======================================= */

    async function loadRecords() {


      try {


        const response =
          await fetch(API_URL);


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.error ||
            "기록을 불러오지 못했습니다."
          );

        }


        displayRecentRecords(
          result.data || []
        );


      } catch (error) {


        console.error(error);


        document
          .getElementById(
            "recentRecords"
          )
          .innerHTML =

          `<div class="empty-message">
            기록을 불러오지 못했습니다.
          </div>`;

      }

    }



    /* ======================================
       최근 기록 표시
    ======================================= */

    function displayRecentRecords(
      records
    ) {


      const container =
        document.getElementById(
          "recentRecords"
        );


      if (
        !records ||
        records.length === 0
      ) {


        container.innerHTML =

          `<div class="empty-message">
            아직 작성한 기록이 없어요 🍋
          </div>`;


        return;

      }



      /*
       * 최신 기록부터 3개 표시
       */

      const recentRecords =
        [...records]
          .reverse()
          .slice(0, 3);



      container.innerHTML =

        recentRecords
          .map(function(record) {


            const preview =
              String(
                record.content || ""
              )
                .replace(
                  /\n/g,
                  " "
                )
                .slice(0, 55);


            return `

              <div class="record-item">

                <div class="record-date">
                  ${formatDate(record.date)}
                </div>


                <div class="record-icons">

                  <span>
                    ${record.mood || "😐"}
                  </span>

                  <span>
                    ${record.weather || ""}
                  </span>

                </div>


                <div class="record-preview">

                  ${escapeHtml(preview)}

                  ${
                    record.content &&
                    record.content.length > 55
                      ? "..."
                      : ""
                  }

                </div>

              </div>

            `;

          })
          .join("");

    }



    /* ======================================
       날짜 형식 변경
    ======================================= */

    function formatDate(
      dateValue
    ) {


      if (!dateValue) {

        return "";

      }


      const date =
        new Date(dateValue);


      if (
        isNaN(
          date.getTime()
        )
      ) {

        return dateValue;

      }


      return date.toLocaleDateString(
        "ko-KR",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );

    }



    /* ======================================
       HTML 특수문자 처리
    ======================================= */

    function escapeHtml(
      value
    ) {


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    /* ======================================
       기록 저장
    ======================================= */

    async function saveRecord() {


      const button =
        document.getElementById(
          "saveButton"
        );


      const content =
        document.getElementById(
          "content"
        ).value.trim();


      /*
       * 선택된 기분
       */

      const selectedMood =
        document.querySelector(
          ".mood.selected"
        );


      const mood =
        selectedMood
          ? selectedMood.textContent.trim()
          : "😐";



      /*
       * 내용 확인
       */

      if (!content) {


        alert(
          "오늘의 내용을 먼저 적어주세요 🍋"
        );


        return;

      }



      /*
       * 오늘 날짜
       */

      const today =
        new Date();


      const date =
        `${today.getFullYear()}-${String(
          today.getMonth() + 1
        ).padStart(2, "0")}-${String(
          today.getDate()
        ).padStart(2, "0")}`;



      /*
       * 스프레드시트로 보낼 데이터
       */

      const data = {

        date:
          date,

        weather:
          selectedWeather,

        mood:
          mood,

        content:
          content

      };



      /*
       * 저장 중 표시
       */

      button.disabled =
        true;

      button.textContent =
        "저장하는 중...";



      try {


        /*
         * text/plain으로 전송
         */

        const response =
          await fetch(
            API_URL,
            {

              method:
                "POST",

              headers:
                {
                  "Content-Type":
                    "text/plain"
                },

              body:
                JSON.stringify(data)

            }
          );



        /*
         * JSON 응답
         */

        const result =
          await response.json();



        if (!result.success) {

          throw new Error(
            result.error ||
            "저장에 실패했습니다."
          );

        }



        /*
         * 저장 성공
         */

        alert(
          "오늘의 기록이 저장되었습니다 🍋"
        );



        /*
         * 입력창 초기화
         */

        document
          .getElementById(
            "content"
          )
          .value = "";



        /*
         * 최근 기록 갱신
         */

        await loadRecords();


      } catch (error) {


        console.error(error);


        alert(
          "저장하지 못했습니다.\n\n" +
          "Apps Script 배포 설정을 확인해주세요."
        );


      } finally {


        button.disabled =
          false;


        button.textContent =
          "오늘의 기록 저장하기";

      }

    }



    /* ======================================
       저장 버튼 이벤트
    ======================================= */

    document
      .getElementById(
        "saveButton"
      )
      .addEventListener(
        "click",
        saveRecord
      );



    /* ======================================
       페이지 시작
    ======================================= */

    setToday();

    loadRecords();


  </script>

</body>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morning Page 🍋</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #FFFBEA;
  color: #4A4635;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

a {
  text-decoration: none;
  color: inherit;
}

button,
input,
textarea {
  font-family: inherit;
}

.header {
  width: 100%;
  border-bottom: 1px solid #F1E7B8;
  background: #FFFBEA;
}

.header-inner {
  width: min(1000px, calc(100% - 40px));
  height: 76px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 21px;
  font-weight: 800;
  color: #5C552F;
}

.nav {
  display: flex;
  gap: 6px;
}

.nav a {
  padding: 9px 13px;
  border-radius: 11px;
  font-size: 13px;
  color: #77705A;
}

.nav a:hover {
  background: #FFF1A8;
}

main {
  width: min(760px, calc(100% - 40px));
  margin: 0 auto;
  padding: 55px 0 80px;
}

.title {
  margin-bottom: 35px;
}

.title small {
  color: #99906C;
  font-size: 13px;
}

.title h1 {
  margin: 8px 0 0;
  font-size: 34px;
  color: #3F3A29;
  letter-spacing: -1px;
}

.title h1 span {
  color: #D4A900;
}

.card {
  background: white;
  border: 1px solid #F0E7BE;
  border-radius: 24px;
  padding: 30px;
  box-shadow: 0 10px 35px rgba(100, 85, 25, 0.05);
}

.label {
  margin: 23px 0 10px;
  font-size: 14px;
  font-weight: 700;
  color: #5D573F;
}

.label:first-child {
  margin-top: 0;
}

.date {
  width: 100%;
  padding: 13px;
  border: 1px solid #EDE5C8;
  border-radius: 12px;
  background: #FFFDF8;
  color: #514C3C;
  outline: none;
}

.weather-list,
.mood-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.weather {
  width: 70px;
  height: 67px;
  border: 1px solid #EDE5C8;
  border-radius: 15px;
  background: #FFFDF8;
  color: #77705A;
  font-size: 11px;
}

.weather span {
  display: block;
  font-size: 25px;
  margin-bottom: 4px;
}

.weather.selected,
.mood.selected {
  background: #FFE45C;
  border-color: #E4C72A;
}

.mood {
  width: 48px;
  height: 48px;
  border: 1px solid #EDE5C8;
  border-radius: 13px;
  background: #FFFDF8;
  font-size: 21px;
}

textarea {
  width: 100%;
  min-height: 300px;
  padding: 17px;
  resize: vertical;
  border: 1px solid #EDE5C8;
  border-radius: 16px;
  background: #FFFDF8;
  color: #514C3C;
  line-height: 1.8;
  outline: none;
}

textarea:focus,
.date:focus {
  border-color: #E4C72A;
}

.save {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: none;
  border-radius: 14px;
  background: #F5D52F;
  color: #554B0C;
  font-size: 15px;
  font-weight: 800;
}

.save:hover {
  background: #EAC91E;
}

.save:disabled {
  opacity: .6;
  cursor: wait;
}

.message {
  text-align: center;
  margin-top: 15px;
  font-size: 13px;
  color: #8C835F;
}

@media (max-width: 600px) {
  .header-inner {
    width: calc(100% - 28px);
    height: 70px;
  }

  .logo {
    font-size: 17px;
  }

  .nav a {
    padding: 7px 7px;
    font-size: 11px;
  }

  main {
    width: calc(100% - 28px);
    padding: 35px 0 55px;
  }

  .title h1 {
    font-size: 28px;
  }

  .card {
    padding: 21px;
    border-radius: 20px;
  }

  .weather {
    width: 61px;
    height: 61px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <a href="index.html" class="logo">
      🍋 Morning Page
    </a>

    <nav class="nav">
      <a href="index.html">오늘 쓰기</a>
      <a href="calendar.html">달력</a>
      <a href="records.html">기록</a>
    </nav>

  </div>
</header>

<main>

  <div class="title">
    <small>My Morning Pages</small>
    <h1>오늘의 <span>마음</span>을 기록해요.</h1>
  </div>

  <div class="card">

    <div class="label">날짜</div>

    <input
      type="date"
      id="date"
      class="date"
    >


    <div class="label">오늘의 날씨</div>

    <div class="weather-list">

      <button class="weather" data-weather="☀️ 맑음">
        <span>☀️</span>맑음
      </button>

      <button class="weather" data-weather="🌤️ 구름 조금">
        <span>🌤️</span>구름 조금
      </button>

      <button class="weather" data-weather="⛅ 흐림">
        <span>⛅</span>흐림
      </button>

      <button class="weather" data-weather="🌧️ 비">
        <span>🌧️</span>비
      </button>

      <button class="weather" data-weather="⛈️ 소나기">
        <span>⛈️</span>소나기
      </button>

      <button class="weather" data-weather="❄️ 눈">
        <span>❄️</span>눈
      </button>

      <button class="weather" data-weather="🌨️ 눈/비">
        <span>🌨️</span>눈/비
      </button>

      <button class="weather" data-weather="🌫️ 안개">
        <span>🌫️</span>안개
      </button>

    </div>


    <div class="label">오늘의 기분</div>

    <div class="mood-list">

      <button class="mood">😭</button>
      <button class="mood">😣</button>
      <button class="mood">😢</button>
      <button class="mood">😞</button>
      <button class="mood">😐</button>
      <button class="mood">🙂</button>
      <button class="mood">😊</button>
      <button class="mood">😄</button>
      <button class="mood">🤩</button>

    </div>


    <div class="label">오늘의 생각</div>

    <textarea
      id="content"
      placeholder="아무 생각이나 자유롭게 적어보세요."
    ></textarea>


    <button
      class="save"
      id="saveButton"
    >
      기록 저장하기 🍋
    </button>

    <div
      class="message"
      id="message"
    ></div>

  </div>

</main>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxV18t2cg8rAPxhnWAm4rvCwyQHV3ODtkkFlmqLq_RyGDF1yd9TdKJhikpyxyFOW0xp/exec";


let selectedWeather = "";
let selectedMood = "";


/* 오늘 날짜 자동 입력 */
const today = new Date();

const year = today.getFullYear();

const month =
String(today.getMonth() + 1)
.padStart(2, "0");

const day =
String(today.getDate())
.padStart(2, "0");

document.getElementById("date").value =
`${year}-${month}-${day}`;


/* 날씨 선택 */

document
.querySelectorAll(".weather")
.forEach(button => {

  button.addEventListener("click", () => {

    document
    .querySelectorAll(".weather")
    .forEach(item =>
      item.classList.remove("selected")
    );

    button.classList.add("selected");

    selectedWeather =
      button.dataset.weather;

  });

});


/* 기분 선택 */

document
.querySelectorAll(".mood")
.forEach(button => {

  button.addEventListener("click", () => {

    document
    .querySelectorAll(".mood")
    .forEach(item =>
      item.classList.remove("selected")
    );

    button.classList.add("selected");

    selectedMood =
      button.textContent.trim();

  });

});


/* 저장 */

document
.getElementById("saveButton")
.addEventListener("click", async () => {

  const date =
    document.getElementById("date").value;

  const content =
    document.getElementById("content")
    .value.trim();

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("saveButton");


  if (!date) {
    alert("날짜를 선택해주세요.");
    return;
  }

  if (!selectedWeather) {
    alert("날씨를 선택해주세요.");
    return;
  }

  if (!selectedMood) {
    alert("기분을 선택해주세요.");
    return;
  }

  if (!content) {
    alert("오늘의 생각을 적어주세요.");
    return;
  }


  button.disabled = true;
  button.textContent = "저장하는 중...";


  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "text/plain"
        },

        body: JSON.stringify({

          action: "create",

          date: date,

          weather: selectedWeather,

          mood: selectedMood,

          content: content

        })

      });


    const result =
      await response.json();


    if (!result.success) {
      throw new Error(result.error);
    }


    message.textContent =
      "기록이 저장되었어요 🍋";


    document.getElementById("content").value = "";


    document
    .querySelectorAll(".weather, .mood")
    .forEach(item =>
      item.classList.remove("selected")
    );


    selectedWeather = "";
    selectedMood = "";


  } catch (error) {

    console.error(error);

    alert("저장하지 못했습니다.");

  } finally {

    button.disabled = false;
    button.textContent = "기록 저장하기 🍋";

  }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Morning Page Calendar 🍋</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #FFFBEA;
  color: #4A4635;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

button {
  font-family: inherit;
  cursor: pointer;
}

a {
  text-decoration: none;
  color: inherit;
}


.header {
  border-bottom: 1px solid #F1E7B8;
}

.header-inner {
  width: min(1000px, calc(100% - 40px));
  height: 76px;

  margin: 0 auto;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 21px;
  font-weight: 800;
  color: #5C552F;
}

.nav {
  display: flex;
  gap: 6px;
}

.nav a {
  padding: 9px 13px;
  border-radius: 11px;

  font-size: 13px;
  color: #77705A;
}

.nav a:hover {
  background: #FFF1A8;
}


main {
  width: min(850px, calc(100% - 40px));
  margin: 0 auto;

  padding: 55px 0 80px;
}


.title {
  margin-bottom: 30px;
}

.title small {
  font-size: 13px;
  color: #99906C;
}

.title h1 {
  margin: 8px 0 0;

  font-size: 34px;
  color: #3F3A29;
}

.title h1 span {
  color: #D4A900;
}


/* 달력 */

.calendar {
  background: white;

  border: 1px solid #F0E7BE;
  border-radius: 24px;

  padding: 25px;

  box-shadow:
    0 10px 35px
    rgba(100, 85, 25, .05);
}


.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 20px;
}

.calendar-header h2 {
  margin: 0;

  font-size: 19px;
}

.month-buttons {
  display: flex;
  gap: 6px;
}

.month-buttons button {
  width: 34px;
  height: 34px;

  border: none;
  border-radius: 10px;

  background: #FFF4B7;
  color: #6B6135;
}


.weekdays,
.days {
  display: grid;
  grid-template-columns:
    repeat(7, 1fr);
}

.weekdays {
  margin-bottom: 8px;
}

.weekdays div {
  text-align: center;
  font-size: 12px;
  color: #99906C;
}


.day {
  min-height: 75px;

  padding: 8px;

  border: none;
  border-radius: 13px;

  background: transparent;

  text-align: left;
  color: #5B5542;

  position: relative;
}

.day:hover {
  background: #FFF8D8;
}

.day.other {
  color: #C8C1A9;
}

.day.has-record {
  background: #FFF4B1;
}

.day-number {
  font-size: 13px;
}

.day-mood {
  margin-top: 8px;
  font-size: 18px;
}


.selected-day {
  margin-top: 20px;

  padding: 23px;

  background: #FFFDF8;

  border-radius: 18px;
}

.selected-day h3 {
  margin: 0 0 12px;

  font-size: 16px;
}

.selected-content {
  white-space: pre-wrap;

  line-height: 1.8;

  font-size: 14px;
}


.no-record {
  color: #9B9377;
  font-size: 13px;
}


@media (max-width: 600px) {

  .header-inner {
    width: calc(100% - 28px);
  }

  .logo {
    font-size: 17px;
  }

  .nav a {
    padding: 7px;
    font-size: 11px;
  }

  main {
    width: calc(100% - 28px);
    padding-top: 35px;
  }

  .title h1 {
    font-size: 28px;
  }

  .calendar {
    padding: 16px;
    border-radius: 19px;
  }

  .day {
    min-height: 55px;
    padding: 5px;
  }

  .day-mood {
    font-size: 15px;
    margin-top: 5px;
  }

}

</style>

</head>


<body>


<header class="header">

  <div class="header-inner">

    <a
      href="index.html"
      class="logo"
    >
      🍋 Morning Page
    </a>


    <nav class="nav">

      <a href="index.html">
        오늘 쓰기
      </a>

      <a href="calendar.html">
        달력
      </a>

      <a href="records.html">
        기록
      </a>

    </nav>

  </div>

</header>



<main>


  <div class="title">

    <small>
      My Morning Pages
    </small>

    <h1>
      나의 <span>달력</span>
    </h1>

  </div>



  <div class="calendar">


    <div class="calendar-header">

      <button
        id="prevMonth"
      >
        ←
      </button>


      <h2
        id="monthTitle"
      ></h2>


      <button
        id="nextMonth"
      >
        →
      </button>

    </div>



    <div class="weekdays">

      <div>일</div>
      <div>월</div>
      <div>화</div>
      <div>수</div>
      <div>목</div>
      <div>금</div>
      <div>토</div>

    </div>



    <div
      id="days"
      class="days"
    ></div>



    <div
      id="selectedDay"
      class="selected-day"
    >

      <h3>
        날짜를 선택해주세요 🍋
      </h3>

      <div class="no-record">
        기록이 있는 날짜를 눌러보세요.
      </div>

    </div>


  </div>

</main>



<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbxV18t2cg8rAPxhnWAm4rvCwyQHV3ODtkkFlmqLq_RyGDF1yd9TdKJhikpyxyFOW0xp/exec";


let records = [];


let currentDate =
  new Date();



/* 날짜를 YYYY-MM-DD로 */

function dateKey(date) {

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const d =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${y}-${m}-${d}`;

}



/* 기록 불러오기 */

async function loadRecords() {

  try {

    const response =
      await fetch(API_URL);

    const result =
      await response.json();

    if (!result.success) {
      throw new Error(result.error);
    }

    records =
      result.data || [];

    renderCalendar();

  } catch (error) {

    console.error(error);

    document.getElementById("days").innerHTML =
      `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#99906C;">
        기록을 불러오지 못했어요.
      </div>`;

  }

}



/* 달력 */

function renderCalendar() {

  const year =
    currentDate.getFullYear();

  const month =
    currentDate.getMonth();


  document.getElementById("monthTitle")
    .textContent =
    `${year}년 ${month + 1}월`;


  const daysContainer =
    document.getElementById("days");


  daysContainer.innerHTML = "";


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const lastDate =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const previousLastDate =
    new Date(
      year,
      month,
      0
    ).getDate();


  /* 이전 달 날짜 */

  for (
    let i = firstDay - 1;
    i >= 0;
    i--
  ) {

    const number =
      previousLastDate - i;

    const button =
      document.createElement("button");

    button.className =
      "day other";

    button.innerHTML =
      `<div class="day-number">${number}</div>`;

    daysContainer.appendChild(button);

  }


  /* 현재 달 */

  for (
    let day = 1;
    day <= lastDate;
    day++
  ) {

    const button =
      document.createElement("button");

    button.className =
      "day";


    const date =
      new Date(
        year,
        month,
        day
      );


    const key =
      dateKey(date);


    const record =
      records.find(
        item =>
          String(item.date) === key
      );


    if (record) {

      button.classList.add(
        "has-record"
      );

    }


    button.innerHTML =
      `<div class="day-number">
        ${day}
      </div>
      ${
        record
        ? `<div class="day-mood">
            ${record.mood || "🍋"}
          </div>`
        : ""
      }`;


    button.addEventListener(
      "click",
      () => {

        showRecord(
          key
        );

      }
    );


    daysContainer.appendChild(
      button
    );

  }

}



/* 날짜 선택 */

function showRecord(key) {

  const container =
    document.getElementById(
      "selectedDay"
    );


  const record =
    records.find(
      item =>
        String(item.date) === key
    );


  const parts =
    key.split("-");


  const formatted =
    `${parts[0]}년 ${Number(parts[1])}월 ${Number(parts[2])}일`;


  if (!record) {

    container.innerHTML =
      `<h3>${formatted}</h3>
       <div class="no-record">
         이날은 기록이 없어요.
       </div>`;

    return;

  }


  container.innerHTML =
    `<h3>
      ${formatted}
      ${record.weather || ""}
      ${record.mood || ""}
    </h3>

    <div class="selected-content">
      ${escapeHtml(record.content)}
    </div>`;

}



/* HTML 안전 처리 */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}



/* 이전 달 */

document
.getElementById("prevMonth")
.addEventListener("click", () => {

  currentDate.setMonth(
    currentDate.getMonth() - 1
  );

  renderCalendar();

});


/* 다음 달 */

document
.getElementById("nextMonth")
.addEventListener("click", () => {

  currentDate.setMonth(
    currentDate.getMonth() + 1
  );

  renderCalendar();

});


loadRecords();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>내 기록 🍋</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #FFFBEA;
  color: #4A4635;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

a {
  text-decoration: none;
  color: inherit;
}

button,
input,
textarea {
  font-family: inherit;
}

.header {
  width: 100%;
  border-bottom: 1px solid #F1E7B8;
}

.header-inner {
  width: min(1000px, calc(100% - 40px));
  height: 76px;
  margin: 0 auto;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 21px;
  font-weight: 800;
  color: #5C552F;
}

.nav {
  display: flex;
  gap: 6px;
}

.nav a {
  padding: 9px 13px;
  border-radius: 11px;
  font-size: 13px;
  color: #77705A;
}

.nav a:hover {
  background: #FFF1A8;
}

main {
  width: min(900px, calc(100% - 40px));
  margin: 0 auto;
  padding: 55px 0 80px;
}

.title {
  margin-bottom: 30px;
}

.title small {
  color: #99906C;
  font-size: 13px;
}

.title h1 {
  margin: 8px 0 0;
  font-size: 34px;
  color: #3F3A29;
}

.title h1 span {
  color: #D4A900;
}

.records {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.card {
  background: white;
  border: 1px solid #F0E7BE;
  border-radius: 22px;
  padding: 25px;
}

.card-top {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}

.date {
  color: #8D8567;
  font-size: 13px;
  margin-bottom: 9px;
}

.icons {
  font-size: 20px;
}

.actions {
  display: flex;
  gap: 6px;
}

.actions button {
  border: none;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12px;
}

.edit {
  background: #FFF0A0;
  color: #62582C;
}

.delete {
  background: #F3EFE1;
  color: #7D765F;
}

.content {
  margin-top: 16px;
  padding: 17px;
  background: #FFFDF8;
  border-radius: 15px;
  white-space: pre-wrap;
  line-height: 1.8;
  font-size: 14px;
}

.empty,
.loading {
  padding: 70px 20px;
  text-align: center;
  color: #9B9377;
  background: white;
  border-radius: 22px;
  border: 1px solid #F0E7BE;
}


/* 모달 */

.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(50, 45, 30, .35);

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  z-index: 1000;
}

.modal-bg.show {
  display: flex;
}

.modal {
  width: min(560px, 100%);
  max-height: 90vh;
  overflow-y: auto;

  background: white;
  border-radius: 24px;
  padding: 28px;
}

.modal h2 {
  margin: 0 0 23px;
  font-size: 21px;
}

.label {
  margin: 18px 0 9px;
  font-size: 13px;
  font-weight: 700;
}

.date-input {
  width: 100%;
  padding: 13px;

  border: 1px solid #EDE5C8;
  border-radius: 12px;

  background: #FFFDF8;
}


/* 날씨 */

.weather-list {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.weather {
  width: 61px;
  height: 61px;

  border: 1px solid #EDE5C8;
  border-radius: 14px;

  background: #FFFDF8;

  font-size: 10px;
  color: #77705A;
}

.weather span {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.weather.selected {
  background: #FFE45C;
  border-color: #E4C72A;
}


/* 기분 */

.mood-list {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.mood {
  width: 46px;
  height: 46px;

  border: 1px solid #EDE5C8;
  border-radius: 13px;

  background: #FFFDF8;

  font-size: 21px;
}

.mood.selected {
  background: #FFE45C;
  border-color: #E4C72A;
}


/* 내용 */

.edit-content {
  width: 100%;
  min-height: 210px;

  padding: 15px;

  resize: vertical;

  border: 1px solid #EDE5C8;
  border-radius: 15px;

  background: #FFFDF8;

  line-height: 1.8;
  outline: none;
}


/* 모달 버튼 */

.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.modal-buttons button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 13px;
  font-weight: 700;
}

.cancel {
  background: #F3EFE1;
  color: #77705A;
}

.save-edit {
  background: #F5D52F;
  color: #554B0C;
}


@media (max-width: 600px) {

  .header-inner {
    width: calc(100% - 28px);
  }

  .logo {
    font-size: 17px;
  }

  .nav a {
    padding: 7px;
    font-size: 11px;
  }

  main {
    width: calc(100% - 28px);
    padding-top: 35px;
  }

  .title h1 {
    font-size: 28px;
  }

  .card {
    padding: 20px;
  }

  .card-top {
    flex-direction: column;
  }

  .actions {
    width: 100%;
  }

  .actions button {
    flex: 1;
  }

  .modal {
    padding: 22px;
  }
}

</style>
</head>


<body>

<header class="header">

  <div class="header-inner">

    <a href="index.html" class="logo">
      🍋 Morning Page
    </a>

    <nav class="nav">
      <a href="index.html">오늘 쓰기</a>
      <a href="calendar.html">달력</a>
      <a href="records.html">기록</a>
    </nav>

  </div>

</header>


<main>

  <div class="title">
    <small>My Morning Pages</small>
    <h1>나의 <span>기록</span></h1>
  </div>


  <div
    id="records"
    class="records"
  >

    <div class="loading">
      기록을 불러오는 중... 🍋
    </div>

  </div>

</main>


<!-- 수정 모달 -->

<div
  id="modalBg"
  class="modal-bg"
>

  <div class="modal">

    <h2>기록 수정하기 🍋</h2>


    <div class="label">
      날짜
    </div>

    <input
      type="date"
      id="editDate"
      class="date-input"
    >


    <div class="label">
      날씨
    </div>

    <div class="weather-list">

      <button
        class="weather"
        data-weather="☀️ 맑음"
      >
        <span>☀️</span>
        맑음
      </button>

      <button
        class="weather"
        data-weather="🌤️ 구름 조금"
      >
        <span>🌤️</span>
        구름 조금
      </button>

      <button
        class="weather"
        data-weather="⛅ 흐림"
      >
        <span>⛅</span>
        흐림
      </button>

      <button
        class="weather"
        data-weather="🌧️ 비"
      >
        <span>🌧️</span>
        비
      </button>

      <button
        class="weather"
        data-weather="⛈️ 소나기"
      >
        <span>⛈️</span>
        소나기
      </button>

      <button
        class="weather"
        data-weather="❄️ 눈"
      >
        <span>❄️</span>
        눈
      </button>

      <button
        class="weather"
        data-weather="🌨️ 눈/비"
      >
        <span>🌨️</span>
        눈/비
      </button>

      <button
        class="weather"
        data-weather="🌫️ 안개"
      >
        <span>🌫️</span>
        안개
      </button>

    </div>


    <div class="label">
      기분
    </div>

    <div class="mood-list">

      <button class="mood">😭</button>
      <button class="mood">😣</button>
      <button class="mood">😢</button>
      <button class="mood">😞</button>
      <button class="mood">😐</button>
      <button class="mood">🙂</button>
      <button class="mood">😊</button>
      <button class="mood">😄</button>
      <button class="mood">🤩</button>

    </div>


    <div class="label">
      내용
    </div>

    <textarea
      id="editContent"
      class="edit-content"
    ></textarea>


    <div class="modal-buttons">

      <button
        id="cancelButton"
        class="cancel"
      >
        취소
      </button>

      <button
        id="saveEditButton"
        class="save-edit"
      >
        수정 저장
      </button>

    </div>

  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxV18t2cg8rAPxhnWAm4rvCwyQHV3ODtkkFlmqLq_RyGDF1yd9TdKJhikpyxyFOW0xp/exec";


let records = [];

let editingRow = null;

let selectedWeather = "";

let selectedMood = "";


/* HTML 안전 처리 */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* 날짜 표시 */

function displayDate(value) {

  if (!value) return "";

  const parts =
    String(value).split("-");

  if (parts.length === 3) {

    return `${parts[0]}년 ${Number(parts[1])}월 ${Number(parts[2])}일`;

  }

  return value;

}


/* 기록 불러오기 */

async function loadRecords() {

  const container =
    document.getElementById("records");

  try {

    const response =
      await fetch(API_URL);

    const result =
      await response.json();

    if (!result.success) {
      throw new Error(result.error);
    }

    records = result.data || [];

    renderRecords();

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        기록을 불러오지 못했어요.
      </div>`;

  }

}


/* 화면에 기록 표시 */

function renderRecords() {

  const container =
    document.getElementById("records");


  if (records.length === 0) {

    container.innerHTML =
      `<div class="empty">
        아직 기록이 없어요 🍋
      </div>`;

    return;

  }


  container.innerHTML =
    [...records]
    .reverse()
    .map(record => `

      <article class="card">

        <div class="card-top">

          <div>

            <div class="date">
              ${escapeHtml(
                displayDate(record.date)
              )}
            </div>

            <div class="icons">
              ${escapeHtml(record.mood)}
              ${escapeHtml(record.weather)}
            </div>

          </div>


          <div class="actions">

            <button
              class="edit"
              onclick="openEdit(${record.row})"
            >
              수정
            </button>

            <button
              class="delete"
              onclick="deleteRecord(${record.row})"
            >
              삭제
            </button>

          </div>

        </div>


        <div class="content">
          ${escapeHtml(record.content)}
        </div>

      </article>

    `)
    .join("");

}


/* 수정창 열기 */

function openEdit(row) {

  const record =
    records.find(
      item => Number(item.row) === Number(row)
    );

  if (!record) {
    alert("기록을 찾을 수 없습니다.");
    return;
  }


  editingRow = record.row;


  document.getElementById("editDate").value =
    convertDate(record.date);

  document.getElementById("editContent").value =
    record.content || "";


  selectedWeather =
    record.weather || "";

  selectedMood =
    record.mood || "";


  document
    .querySelectorAll(".weather")
    .forEach(button => {

      button.classList.toggle(
        "selected",
        button.dataset.weather === selectedWeather
      );

    });


  document
    .querySelectorAll(".mood")
    .forEach(button => {

      button.classList.toggle(
        "selected",
        button.textContent.trim() === selectedMood
      );

    });


  document
    .getElementById("modalBg")
    .classList.add("show");

}


/* 날짜 변환 */

function convertDate(value) {

  if (!value) return "";

  if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
    return value;
  }

  const numbers =
    String(value).match(/\d+/g);

  if (
    numbers &&
    numbers.length >= 3
  ) {

    return `${numbers[0]}-${String(numbers[1]).padStart(2, "0")}-${String(numbers[2]).padStart(2, "0")}`;

  }

  return "";

}


/* 날씨 */

document
.querySelectorAll(".weather")
.forEach(button => {

  button.addEventListener("click", () => {

    document
    .querySelectorAll(".weather")
    .forEach(item =>
      item.classList.remove("selected")
    );

    button.classList.add("selected");

    selectedWeather =
      button.dataset.weather;

  });

});


/* 기분 */

document
.querySelectorAll(".mood")
.forEach(button => {

  button.addEventListener("click", () => {

    document
    .querySelectorAll(".mood")
    .forEach(item =>
      item.classList.remove("selected")
    );

    button.classList.add("selected");

    selectedMood =
      button.textContent.trim();

  });

});


/* 수정 저장 */

document
.getElementById("saveEditButton")
.addEventListener("click", async () => {

  if (!editingRow) return;


  const date =
    document.getElementById("editDate").value;

  const content =
    document.getElementById("editContent")
    .value.trim();


  if (!date) {
    alert("날짜를 선택해주세요.");
    return;
  }

  if (!selectedWeather) {
    alert("날씨를 선택해주세요.");
    return;
  }

  if (!selectedMood) {
    alert("기분을 선택해주세요.");
    return;
  }

  if (!content) {
    alert("내용을 입력해주세요.");
    return;
  }


  const button =
    document.getElementById("saveEditButton");

  button.disabled = true;
  button.textContent = "저장 중...";


  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "text/plain"
        },

        body: JSON.stringify({

          action: "update",

          row: editingRow,

          date: date,

          weather: selectedWeather,

          mood: selectedMood,

          content: content

        })

      });


    const result =
      await response.json();


    if (!result.success) {
      throw new Error(result.error);
    }


    alert("기록이 수정되었습니다 🍋");

    closeModal();

    await loadRecords();


  } catch (error) {

    console.error(error);

    alert("수정하지 못했습니다.");

  } finally {

    button.disabled = false;
    button.textContent = "수정 저장";

  }

});


/* 삭제 */

async function deleteRecord(row) {

  const record =
    records.find(
      item => Number(item.row) === Number(row)
    );


  if (!record) {
    alert("기록을 찾을 수 없습니다.");
    return;
  }


  const yes =
    confirm(
      "이 기록을 삭제할까요?\n\n삭제하면 복구할 수 없습니다."
    );


  if (!yes) return;


  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "text/plain"
        },

        body: JSON.stringify({

          action: "delete",

          row: row

        })

      });


    const result =
      await response.json();


    if (!result.success) {
      throw new Error(result.error);
    }


    alert("기록이 삭제되었습니다.");

    await loadRecords();


  } catch (error) {

    console.error(error);

    alert("삭제하지 못했습니다.");

  }

}


/* 모달 닫기 */

function closeModal() {

  document
    .getElementById("modalBg")
    .classList.remove("show");

  editingRow = null;

}


/* 취소 */

document
.getElementById("cancelButton")
.addEventListener(
  "click",
  closeModal
);


/* 바깥 클릭 */

document
.getElementById("modalBg")
.addEventListener("click", event => {

  if (
    event.target ===
    document.getElementById("modalBg")
  ) {

    closeModal();

  }

});


loadRecords();

</script>

</body>
</html>
